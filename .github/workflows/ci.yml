name: CI

# Lightweight build-and-verify gate. Runs on every push (except master, which
# is owned by the release pipeline) and every PR. Keeps `development` honest
# and prevents broken commits from reaching `master`.
on:
  # `development` is verified by auto-merge.yml (which also promotes it to
  # master on success), so we skip it here to avoid running the same checks
  # twice on every push. Feature branches and PRs still flow through this
  # workflow.
  push:
    branches-ignore:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

jobs:
  verify:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (skip silently if no lint script)
        run: |
          if npm run --silent | grep -q '^  lint'; then
            npm run lint
          else
            echo "No 'lint' script defined — skipping."
          fi

      - name: Build web bundle
        # Firebase config is baked into the bundle at build time via Vite's
        # import.meta.env. If the secrets aren't set, the app boots into the
        # SetupRequired screen instead of crashing — so this is non-fatal.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
        run: npm run build

      - name: Build Electron main + preload
        run: npx cross-env ELECTRON=true vite build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error
