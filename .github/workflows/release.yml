name: Release

# Production pipeline. A push to `master` is the single source of truth for
# shipping: this workflow auto-detects the version bump from conventional commits
# (major/minor/patch), deploys the marketing/web shell to Netlify, and builds +
# publishes Electron installers for Windows / macOS / Linux. Web, Windows, macOS
# and Linux each ship independently of one another — a failure building or
# publishing one platform never blocks the others (see `create-release` +
# `build-electron` below). CHANGELOG.md is curated by the developer before
# committing — CI never overwrites it.
#
# Manual `workflow_dispatch` is also supported for ad-hoc releases (e.g. a
# point fix that doesn't land on master through the normal commit flow).
on:
  # Full automation: every promotion to master ships a new patch release.
  # `paths-ignore` lets you fix typos in docs without burning a release; the
  # `[skip ci]` marker on the auto-generated version-bump commit prevents
  # recursive triggers.
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = detect from conventional commits)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

env:
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

jobs:
  prepare:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json
        id: bump
        run: |
          # patch/minor/major wins when explicitly chosen; everything else
          # (including the "auto" default and the push trigger where inputs is
          # empty) falls through to conventional-commit auto-detection.
          case "${{ inputs.bump }}" in
            patch|minor|major)
              KIND="${{ inputs.bump }}"
              ;;
            *)
              PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              RANGE=${PREV_TAG:+"$PREV_TAG..HEAD"}
              COMMITS=$(git log $RANGE --no-merges --pretty=format:"%s%n%b")
              if echo "$COMMITS" | grep -qE '(BREAKING CHANGE|^[a-zA-Z]+!:)'; then
                KIND=major
              elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
                KIND=minor
              else
                KIND=patch
              fi
              ;;
          esac
          echo "Bump kind: $KIND"
          NEW_VERSION=$(npm version "$KIND" --no-git-tag-version | tr -d v)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "PRO TRACK → v$NEW_VERSION"

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin HEAD --tags
          # Keep development in lock-step with master so the next push to
          # development can still fast-forward into master. Without this
          # the release-bump commit only lands on master, the branches
          # diverge, and auto-merge.yml falls back to PR mode forever.
          git push origin "HEAD:development" || \
            echo "::warning::Could not fast-forward development — manual rebase may be needed."

  # Creates the GitHub Release shell (tag + notes, no assets) exactly once,
  # before any platform build starts. Each platform job below then uploads its
  # own installer to this already-existing release independently — so one
  # platform failing (macOS notarization flaking is the classic case) never
  # blocks the other two from shipping. This replaces the old single
  # `finalize` gate that needed ALL THREE matrix legs to succeed before ANY
  # installer was published.
  #
  # The shell is created as a DRAFT. electron-updater only ever considers
  # PUBLISHED releases, so while it's a draft, no client can see (or 404 on) a
  # release whose latest.yml hasn't been uploaded yet. The `finalize-release`
  # job below flips it to published once the update feeds are attached. This is
  # the fix for "Cannot find latest.yml … HttpError: 404": previously the shell
  # went public immediately and clients polling in the upload window (or after a
  # failed Windows leg) hit a permanent/transient 404.
  create-release:
    name: Create release shell
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Extract release section from CHANGELOG
        id: notes
        env:
          # `prepare` exposes `new_version` (not `version`) — the wrong name
          # resolved to "" and made every release fall back to auto-generated notes.
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          awk "/^## v$NEW_VERSION /{flag=1; next} /^## v/{flag=0} flag" CHANGELOG.md > release-notes.md
          # v2.7.0 and v2.8.1 both shipped with a blank release body because no
          # matching "## vX.Y.Z" section existed at tag time and this silently
          # produced an empty file. Fall back to GitHub's auto-generated notes
          # instead of publishing a blank description.
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## v$NEW_VERSION' section in CHANGELOG.md — using auto-generated release notes instead. Add a changelog entry before releasing for curated notes."
          fi

      - name: Create GitHub Release (curated notes)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PRO TRACK ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          # Stay a draft (invisible to electron-updater) until finalize-release
          # confirms the update feeds are attached.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (auto-generated notes fallback)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PRO TRACK ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    name: Deploy web → Netlify
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
        run: npm run build

      # `secrets` is not available in an `if:` expression, and a step's own `env`
      # is not visible to its own `if:` either — so a step that tests a secret
      # directly is either rejected outright (invalid workflow) or silently never
      # runs. Read the secrets into a plain output here and gate on that instead.
      - name: Check Netlify credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — skipping the CI Netlify deploy."
          fi

      - name: Deploy to Netlify
        if: steps.netlify.outputs.enabled == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --dir=dist \
            --prod \
            --message="Release ${{ needs.prepare.outputs.tag }}"

  build-electron:
    name: Build Electron · ${{ matrix.os }}
    # Depends on create-release (not on the other OS legs) — this job publishes
    # its own installer straight to the release as soon as IT is done, so
    # Windows/macOS/Linux ship independently of one another.
    needs: [prepare, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist the electron + electron-builder binary downloads across runs.
      # These are what time out (504) against the mirror; a warm cache means a
      # flaky download is the exception, not the thing that kills a release.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build installer (no publish — this job uploads it below)
        # `--publish never` produces the installer + electron-updater metadata
        # locally; the "Publish installer to release" step below then uploads
        # them synchronously and independently per OS, which avoids
        # electron-builder's own async-publish race condition that killed
        # Windows/Mac uploads in 1.1.3 when each matrix job exited before its
        # async PUT to the GH releases API completed.
        #
        # Retried up to 3× — a single transient binary-mirror 504 on ONE OS
        # only fails that OS's leg now, not the whole release (in the old
        # single-gate design this dropped the entire release — v1.6.0 was
        # lost this way).
        uses: nick-fields/retry@v3
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run electron:build -- --publish never

      - name: Keep a short-lived debug copy of the installer
        # Not the distribution path anymore (see next step) — just a recovery
        # net if the publish step below fails after a successful build, so a
        # re-run doesn't require rebuilding from scratch.
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          retention-days: 7
          if-no-files-found: error

      # Publishes straight to the release created by `create-release`,
      # independently of the other two OS legs. Retried like the build step —
      # a transient GitHub API hiccup here shouldn't cost a whole platform's
      # release when the installer already built fine.
      - name: Publish installer to release
        # `shell: bash` matters here: windows-latest's default `run:` shell is
        # pwsh, which doesn't glob-expand args to external commands the way
        # bash does — gh would get literal "release/*.dmg" strings and error.
        # `nullglob` makes patterns with no match on this OS (e.g. *.dmg on
        # Windows) disappear instead of being passed through literally.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          command: |
            shopt -s nullglob
            files=(release/*.exe release/*.dmg release/*.AppImage release/latest*.yml)
            gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # An unsigned APK cannot be installed on a device, and the in-app updater
  # offers any `.apk` release asset — so publishing one would ship a dead update.
  # Build the APK only when the signing secrets exist; otherwise skip the whole
  # Android job with a visible warning (the desktop release is unaffected).
  # `secrets` can't be used in a job/step `if:`, so they're read into env here and
  # exposed as a plain output that `build-android` gates on.
  android-signing:
    name: Check Android signing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK skipped — one or more of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD is not set as a repository secret. See CLAUDE.md > CI/CD."
          fi

  build-android:
    name: Android APK
    needs: [prepare, create-release, android-signing]
    if: needs.android-signing.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # `cap:build` = `cross-env CAPACITOR=true vite build && cap sync android`.
      # Going through the npm script matters: a bare `cross-env …` in a `run:`
      # step is "command not found" because node_modules/.bin is only on PATH
      # inside npm scripts.
      - name: Build web bundle & sync Capacitor
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
        run: npm run cap:build

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # android/app/build.gradle resolves ANDROID_KEYSTORE_PATH relative to the
      # app module, so `release.keystore` → android/app/release.keystore.
      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # Only `app-release.apk` (signed) is published. If signing silently didn't
      # apply, Gradle emits `app-release-unsigned.apk` instead — fail loudly here
      # rather than ship an uninstallable update. Kept out of the retry wrapper
      # below since a missing file isn't transient.
      - name: Verify signed APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found at $apk (found: $(ls android/app/build/outputs/apk/release/ 2>&1 | tr '\n' ' '))"
            exit 1
          fi

      - name: Publish APK to Release
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          command: gh release upload "${{ needs.prepare.outputs.tag }}" android/app/build/outputs/apk/release/app-release.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Flips the draft release to PUBLISHED — but only once at least one platform's
  # update feed (latest*.yml) is actually attached. `if: always()` so a single
  # failed OS leg still ships the platforms that succeeded (preserving the
  # independent-shipping design), while a build where NOTHING uploaded stays a
  # draft instead of going public and 404-ing every client's update check.
  finalize-release:
    name: Publish release
    needs: [prepare, build-electron, build-android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish only when an update feed is present
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)
          echo "Assets currently on $TAG:"
          echo "$assets"
          if echo "$assets" | grep -qiE '^latest.*\.yml$'; then
            gh release edit "$TAG" --repo "$REPO" --draft=false
            echo "Published $TAG (update feed present)."
          else
            echo "::error::No latest*.yml attached to $TAG — leaving it as a DRAFT so clients never see a release that 404s on update. Re-run the Electron build to attach installers, then this job republishes it."
            exit 1
          fi
