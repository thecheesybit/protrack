name: Auto-merge development → master

# Promotes verified development commits to master automatically. Triggers on
# every push to `development`: re-runs the build/lint/emoji guard, and if green
# AND the merge is a clean fast-forward, pushes the new history to master.
#
# Falls back to opening a PR when:
#   - Verification fails (so you see the error inline on the PR)
#   - The branches have diverged (manual conflict resolution required)
#
# Release pipeline stays manual (workflow_dispatch). After this workflow
# updates master, dispatch `release.yml` when you're ready to ship.
on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: auto-merge
  cancel-in-progress: false

env:
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

permissions:
  contents: write
  pull-requests: write
  actions: write  # required to `gh workflow run release.yml` after promotion

jobs:
  verify-and-merge:
    name: Verify development & promote
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout development with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (skip silently if no lint script)
        run: |
          if npm run --silent | grep -q '^  lint'; then
            npm run lint
          else
            echo "No 'lint' script defined — skipping."
          fi

      - name: Build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
        run: npm run build

      - name: Build Electron main + preload
        run: npx cross-env ELECTRON=true vite build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt fast-forward merge into master
        id: merge
        run: |
          git fetch origin master:master

          # Self-heal divergence: release.yml's prepare job pushes a version-
          # bump commit directly to master, which can race with a developer's
          # next push to development. When that happens, master has commits
          # development doesn't, and the ff check below fails.
          #
          # We rebase development on top of master and force-push it. This
          # makes master a strict ancestor of development again, so the ff
          # check downstream succeeds without manual intervention.
          if ! git merge-base --is-ancestor master development; then
            echo "::notice::Master is ahead of development — auto-rebasing development on master."
            git rebase master development || {
              echo "::error::Rebase conflict — manual intervention required."
              exit 1
            }
            git push origin development --force-with-lease
          fi

          if git merge-base --is-ancestor master development; then
            git checkout master
            git merge --ff-only development
            git push origin master
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::development promoted to master via fast-forward."
          else
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Branches still diverged after rebase — opening PR for review."
          fi

      - name: Trigger release pipeline
        # GitHub suppresses workflow triggers from pushes made by GITHUB_TOKEN
        # (loop prevention), so release.yml's `on: push` won't fire from our
        # ff-push above. We dispatch it explicitly here, which DOES respect
        # GITHUB_TOKEN. Only do this when the head commit actually warrants
        # a release (skip docs-only / [skip ci]).
        if: steps.merge.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG=$(git log -1 --pretty=%B master)
          if echo "$MSG" | grep -q '\[skip ci\]'; then
            echo "::notice::Skip-ci marker present — release not dispatched."
            exit 0
          fi
          # Skip if the only files changed are docs / markdown (matches the
          # paths-ignore in release.yml so behaviour stays consistent).
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if echo "$CHANGED" | grep -qvE '^(docs/|.*\.md$|\.github/.*\.md$)'; then
            gh workflow run release.yml --ref master
            echo "::notice::Release pipeline dispatched (conventional-commit auto-detection)."
          else
            echo "::notice::Docs-only change — release not dispatched."
          fi

      - name: Open PR when ff is not possible
        if: steps.merge.outputs.promoted != 'true'
        # Soft-fail: if the repo hasn't enabled "Allow GitHub Actions to create
        # PRs", the workflow still surfaces the divergence as a warning instead
        # of marking the run red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Either reuse an open PR or create a fresh one. Marking it as a
          # manual-review case so you know the auto-merge couldn't apply.
          EXISTING=$(gh pr list --base master --head development --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Existing PR #$EXISTING — refreshing label."
            gh pr edit "$EXISTING" --add-label "auto-merge-blocked" || true
          else
            gh pr create \
              --base master \
              --head development \
              --title "Promote development → master (manual review needed)" \
              --body "Auto-merge could not fast-forward — branches have diverged. Resolve and merge manually." \
              --label "auto-merge-blocked" || \
            gh pr create \
              --base master \
              --head development \
              --title "Promote development → master (manual review needed)" \
              --body "Auto-merge could not fast-forward — branches have diverged. Resolve and merge manually."
          fi
