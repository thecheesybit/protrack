<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090e" />
    <meta
      name="description"
      content="PRO TRACK — a radically simplified, auto-adapting productivity workspace."
    />
    <title>PRO TRACK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@300..900&family=Lora:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Google Identity Services — powers silent OAuth token refresh for the
         two-way Google Calendar sync (see src/lib/gauth.js). Safe no-op when
         VITE_GOOGLE_OAUTH_CLIENT_ID is unset. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker for the WEB build only. The desktop app is
      // served from an internal http://localhost server reading local files, so a
      // SW adds no offline benefit and its stale-while-revalidate app-shell cache
      // could serve an outdated index.html after an auto-update (asset names are
      // hashed) — so skip it in Electron.
      if ('serviceWorker' in navigator && !/electron/i.test(navigator.userAgent)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration failed:', err)
          })
        })
      }
    </script>
  </body>
</html>
