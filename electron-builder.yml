appId: com.protrack.app
productName: PRO TRACK
copyright: Copyright © 2026 PRO TRACK

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron

# A 512px PNG is enough — electron-builder derives .ico/.icns per platform.
icon: build/icon.png

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PRO TRACK
  uninstallDisplayName: PRO TRACK ${version}
  artifactName: PRO-TRACK-Setup-${version}.${ext}
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png

linux:
  target:
    - AppImage
  category: Productivity
  icon: build/icon.png
