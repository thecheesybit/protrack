appId: com.protrack.app
productName: PRO TRACK
copyright: Copyright © 2026 AYUSH KUMAR

# Auto-update feed — electron-updater reads releases from this GitHub repo and
# emits latest.yml alongside the installer. Repo must be public (or use a token)
# for clients to fetch updates.
publish:
  provider: github
  owner: thecheesybit
  repo: protrack

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron

# A 512px PNG is enough — electron-builder derives .ico/.icns per platform.
icon: build/icon.png

# Two Windows shipping targets:
#  - nsis (default) → GitHub Releases + electron-updater self-update
#  - appx (explicit: `npm run electron:build:appx`) → Microsoft Store submission;
#    the Store owns updates there, so main.js disables electron-updater when
#    process.windowsStore is true. appx is intentionally NOT in the default
#    target list — CI release builds must keep producing only the NSIS asset
#    set that latest.yml references.
win:
  target:
    - nsis
  icon: build/icon.png

# Microsoft Store identity. identityName + publisher MUST be replaced with the
# values from Partner Center (Product management → Product identity) after
# reserving the app name — Store validation rejects mismatches. The package
# builds unsigned for local testing; Partner Center re-signs on ingestion.
appx:
  identityName: REPLACE.WITH.PartnerCenter.IdentityName
  publisher: CN=REPLACE-WITH-PARTNER-CENTER-PUBLISHER-GUID
  publisherDisplayName: AYUSH KUMAR
  applicationId: PROTRACK
  displayName: PRO TRACK
  backgroundColor: '#09090e'
  artifactName: PRO-TRACK-${version}-${arch}.${ext}

# One-click (assistant-less) installer: a fresh install shows only a progress
# bar, and electron-updater's silent quitAndInstall(true, …) can apply updates
# with zero wizard UI. One-click cannot offer a custom install directory — fine
# for a single-user desktop app; existing installs upgrade in place via the
# registry entry regardless.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PRO TRACK
  uninstallDisplayName: PRO TRACK ${version}
  artifactName: PRO-TRACK-Setup-${version}.${ext}
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png

# Space-free artifact names. The productName "PRO TRACK" contains a space; left
# to the default, electron-builder emits "PRO TRACK-…dmg" and GitHub rewrites the
# uploaded asset's spaces to dots ("PRO.TRACK-…"), so it no longer matches the
# url/path electron-updater reads from latest-mac.yml / latest-linux.yml → 404 on
# update. Hyphenated names keep on-disk == latest*.yml == GitHub asset (Windows
# nsis already does this via its own artifactName above).
dmg:
  artifactName: PRO-TRACK-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Productivity
  icon: build/icon.png
  artifactName: PRO-TRACK-${version}-${arch}.${ext}
